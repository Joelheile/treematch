name: Deploy to Vercel

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Trigger Vercel Deployment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check if committer is admin
        id: check_admin
        run: |
          echo "Checking if ${{ github.actor }} is a repository admin..."
          
          # Get user's permission level
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission")
          
          permission=$(echo "$response" | grep -o '"permission":"[^"]*' | cut -d'"' -f4)
          echo "User permission level: $permission"
          
          if [ "$permission" = "admin" ]; then
            echo "is_admin=true" >> $GITHUB_OUTPUT
            echo "🛑 Skipping deployment - commit made by repository admin"
          else
            echo "is_admin=false" >> $GITHUB_OUTPUT
            echo "✅ Proceeding with deployment - commit made by non-admin user"
          fi
        
      - name: Trigger Vercel Deploy
        if: steps.check_admin.outputs.is_admin == 'false'
        run: |
          echo "Triggering Vercel deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ] || [ "$http_code" -eq 202 ]; then
            echo "✅ Deployment triggered successfully"
            echo "Job ID: $(echo "$body" | grep -o '"id":"[^"]*' | cut -d'"' -f4)"
          else
            echo "❌ Failed to trigger deployment"
            exit 1
          fi
        
      - name: Deployment Status
        if: steps.check_admin.outputs.is_admin == 'false'
        run: |
          echo "Deployment webhook has been triggered."
          echo "Check your Vercel dashboard for deployment status."
          
      - name: Admin Commit Notice
        if: steps.check_admin.outputs.is_admin == 'true'
        run: |
          echo "ℹ️  Deployment skipped because commit was made by a repository admin."
          echo "This helps prevent unnecessary deployments during maintenance or admin tasks." 